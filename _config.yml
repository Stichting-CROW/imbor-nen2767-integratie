title: "IMBOR × NEN 2767-4"
description: "Voorstel voor een werkbare, herleidbare methode om concepten uit NEN 2767-4 op te nemen in IMBOR, verankerd in de modelleerpatronen van NEN 2660-2."
locale: "nl"

remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "sunrise"
search: false

# Geen losse berichten → lege RSS-feed; verberg het feed-icoon in de footer.
atom_feed:
  hide: true

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - script

defaults:
  - scope:
      path: ""
    values:
      layout: single
      toc: true
      toc_sticky: true
      toc_label: "Inhoudsopgave"
      toc_icon: "list-ul"
      read_time: true
