# van het thema wordt niet geladen, dus zonder dit bestand valt alle UI terug
# op het Engelse default. site.locale staat op "nl", dus de strings horen onder
# de sleutel "nl". Ontbrekende sleutels vallen vanzelf terug op Engels.
